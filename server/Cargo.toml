[package]
name = "firefox-codex-mcp"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
default-run = "firefox-codex-mcp"

[dependencies]
anyhow = "1"
base64 = "0.23"
futures-util = "0.3"
hmac = "0.12"
libc = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
url = "2"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
tempfile = "3"
