[package]
name = "firefox-codex-mcp"
version = "0.4.2"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
default-run = "firefox-codex-mcp"

[dependencies]
anyhow = "1"
getrandom = "0.3"
zip = { version = "4", default-features = false, features = ["deflate"] }
base64 = "0.23"
futures-util = "0.3"
hmac = "0.12"
libc = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
url = "2"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
toml_edit = "0.23"
