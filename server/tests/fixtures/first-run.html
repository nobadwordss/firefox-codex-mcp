<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>First web task</title>
<style>
body { font: 20px/1.7 system-ui, sans-serif; color: #17202b; background: #f3f5f8; margin: 60px auto; max-width: 800px; padding: 0 28px; }
main { background: white; border: 1px solid #dfe3ea; border-radius: 16px; padding: 32px; }
button, input { font: inherit; padding: 8px 14px; border: 1px solid #aab4c1; border-radius: 8px; }
button { background: #175cd3; color: white; cursor: pointer; }
label { display: block; margin-top: 20px; }
input { display: block; margin-top: 6px; }
#state { color: #17613a; font-weight: 600; }
</style>
<main>
  <h1>First web task</h1>
  <p>This page verifies reading, clicking and typing in a disposable browser.</p>
  <p id="observation-code"></p>
  <button id="count" type="button">Count 0</button>
  <label>Message <input id="message" type="text"></label>
  <p id="state" role="status" aria-live="polite">Ready</p>
</main>
<script>
let count = 0;
document.querySelector('#observation-code').textContent = 'Observation code: ' + crypto.randomUUID().slice(0, 8);
document.querySelector('#count').addEventListener('click', event => {
  event.currentTarget.textContent = 'Count ' + (++count);
  document.querySelector('#state').textContent = 'Count updated to ' + count;
});
</script>
</html>
